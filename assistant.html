<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>崇正國樂團 - 行政協助平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'Noto Sans TC', 'sans-serif'] } } } }</script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: linear-gradient(135deg, #eef2f6, #dfe7f0);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .glass {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.55);
        }

        .btn-ind {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
        }

        .btn-grn {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .step-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 900;
        }

        .helper-card {
            transition: all .2s;
            cursor: pointer;
        }

        .helper-card.selected {
            border-color: #6366f1 !important;
            background: rgba(99, 102, 241, .08);
        }

        ::-webkit-scrollbar {
            width: 5px
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, .2);
            border-radius: 99px
        }
    </style>
</head>

<body class="font-sans antialiased pb-24">

    <!-- 提示通知框 -->
    <div id="toast"
        class="fixed top-5 left-1/2 -translate-x-1/2 z-50 opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2 px-5 py-3.5 rounded-2xl shadow-xl text-white font-extrabold text-sm text-center max-w-xs w-[90%] justify-center"
        style="transform:translate(-50%,-16px)">
        <i id="toast-icon" class="w-4 h-4 shrink-0"></i><span id="toast-msg"></span>
    </div>

    <div class="max-w-md mx-auto px-4 pt-6">

        <!-- ═══ 登入 / 註冊視圖 ═══ -->
        <div id="v-login" class="space-y-6">
            <div class="text-center space-y-2 pt-8">
                <div
                    class="w-16 h-16 btn-ind rounded-3xl mx-auto flex items-center justify-center shadow-lg shadow-indigo-200/60">
                    <i data-lucide="shield-check" class="w-8 h-8 text-white"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-800">行政協助平台</h1>
                <p class="text-xs text-slate-400 font-bold">錄影・音控・場務 專用入口</p>
            </div>
            <div class="glass p-6 rounded-3xl shadow-xl space-y-4">
                <div class="flex gap-1 p-1 bg-slate-100 rounded-2xl">
                    <button onclick="setAuthMode('login')" id="tab-login"
                        class="flex-1 py-2 rounded-xl text-xs font-black bg-white text-indigo-600 shadow-sm transition-all">登入</button>
                    <button onclick="setAuthMode('register')" id="tab-register"
                        class="flex-1 py-2 rounded-xl text-xs font-black text-slate-400 transition-all">申請帳號</button>
                </div>

                <div id="form-login" class="space-y-3">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-1">帳號</label>
                        <input type="email" id="l-email" placeholder="yourname"
                            class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 outline-none text-sm font-semibold focus:border-indigo-400 transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-1">密碼</label>
                        <input type="password" id="l-pass" placeholder="請輸入密碼"
                            class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 outline-none text-sm font-semibold focus:border-indigo-400 transition-all">
                    </div>
                    <button onclick="handleLogin()" id="btn-login"
                        class="w-full py-4 rounded-2xl text-white font-black text-sm btn-ind active:scale-95 transition-all shadow-md flex items-center justify-center gap-2 mt-2">
                        <i data-lucide="log-in" class="w-4 h-4"></i> 登入
                    </button>
                </div>

                <div id="form-register" class="hidden space-y-3">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-1">姓名</label>
                        <input type="text" id="r-name" placeholder="您的真實姓名"
                            class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 outline-none text-sm font-semibold focus:border-indigo-400">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-1">帳號</label>
                        <input type="email" id="r-email" placeholder="yourname"
                            class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 outline-none text-sm font-semibold focus:border-indigo-400">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-1">密碼</label>
                        <input type="password" id="r-pass" placeholder="設定登入密碼"
                            class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 outline-none text-sm font-semibold focus:border-indigo-400">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-1">協助職能</label>
                        <select id="r-instrument"
                            class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 outline-none text-sm font-bold focus:border-indigo-400">
                            <option value="錄影">錄影組</option>
                            <option value="音控">音控組</option>
                            <option value="場務">場務組</option>
                            <option value="攝影">攝影組</option>
                            <option value="燈光">燈光組</option>
                            <option value="行政">一般行政</option>
                        </select>
                    </div>
                    <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3">
                        <p class="text-[9px] text-amber-700 font-bold">ℹ️ 帳號將由幹部審核確認。</p>
                    </div>
                    <button onclick="handleRegister()" id="btn-register"
                        class="w-full py-4 rounded-2xl text-white font-black text-sm btn-grn active:scale-95 transition-all shadow-md flex items-center justify-center gap-2">
                        <i data-lucide="user-plus" class="w-4 h-4"></i> 申請行政帳號
                    </button>
                </div>
            </div>
            <p class="text-[9px] text-slate-400 font-bold text-center">此頁面僅限行政協助人員使用</p>
        </div>

        <!-- ═══ 主控台視圖 ═══ -->
        <div id="v-dash" class="hidden space-y-5">

            <!-- 頂部用戶資訊 -->
            <div class="flex justify-between items-center glass p-4 rounded-3xl shadow-sm">
                <div class="flex items-center gap-3">
                    <div id="hdr-avatar"
                        class="w-10 h-10 rounded-2xl btn-ind text-white flex items-center justify-center font-black text-base">
                        ?</div>
                    <div>
                        <p id="hdr-name" class="text-sm font-black text-slate-800">-</p>
                        <span id="hdr-duty"
                            class="text-[9px] font-black text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">行政組</span>
                    </div>
                </div>
                <button onclick="handleLogout()"
                    class="w-8 h-8 rounded-xl bg-white border border-slate-100 flex items-center justify-center text-slate-400 hover:text-rose-500 active:scale-95 transition-all">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- 組員管理分頁 -->
            <div id="tab-roster" class="tab-pane hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-base font-black text-slate-800 flex items-center gap-1.5"><i data-lucide="users"
                            class="w-4 h-4 text-indigo-500"></i> 歷屆組員</h2>
                    <select id="roster-filter" onchange="loadRoster()"
                        class="bg-white px-3 py-1.5 rounded-2xl text-[10px] font-black border border-slate-200 outline-none shadow-sm">
                        <option value="音控">音控組</option>
                        <option value="錄影">錄影組</option>
                        <option value="場務">場務組</option>
                        <option value="攝影">攝影組</option>
                        <option value="燈光">燈光組</option>
                        <option value="all">全行政</option>
                    </select>
                </div>
                <div id="roster-list" class="space-y-2.5"></div>
            </div>

            <!-- 交通與用餐調查分頁 (多步驟精靈) -->
            <div id="tab-reports" class="tab-pane hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-base font-black text-slate-800 flex items-center gap-1.5"><i data-lucide="car"
                            class="w-4 h-4 text-indigo-500"></i> 交通與用餐統計調查</h2>
                    <button onclick="openFormBuilder()" id="btn-form-builder"
                        class="hidden px-3 py-1.5 rounded-xl bg-indigo-50 border border-indigo-200 text-indigo-700 text-[10px] font-black flex items-center gap-1 active:scale-95">
                        <i data-lucide="sliders" class="w-3.5 h-3.5"></i> 自訂問卷題目
                    </button>
                </div>

                <!-- 幹部動態自訂題目面板 (僅 Admin 可見) -->
                <div id="form-builder-panel"
                    class="hidden glass p-4 rounded-3xl shadow-md space-y-4 border-2 border-indigo-200">
                    <div class="flex justify-between items-center border-b border-slate-200/60 pb-2">
                        <p class="text-xs font-black text-indigo-900 flex items-center gap-1.5"><i data-lucide="sliders"
                                class="w-4 h-4 text-indigo-600"></i> 自訂問卷題目與選項管理</p>
                        <button onclick="closeFormBuilder()" class="text-slate-400 hover:text-slate-600"><i
                                data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <p class="text-[10px] text-slate-500 font-bold">您可以自由新增、刪除或修改本次問卷的所有題目與選項：</p>

                    <div id="builder-questions-list" class="space-y-3"></div>

                    <div class="flex gap-2">
                        <button onclick="addBuilderQuestion()"
                            class="flex-1 py-2.5 rounded-xl bg-white border border-indigo-300 text-indigo-600 font-black text-xs flex items-center justify-center gap-1.5 active:scale-95 shadow-sm">
                            <i data-lucide="plus" class="w-4 h-4"></i> 新增題目
                        </button>
                        <button onclick="resetToDefaultQuestions()"
                            class="flex-1 py-2.5 rounded-xl bg-amber-50 border border-amber-300 text-amber-700 font-black text-xs flex items-center justify-center gap-1.5 active:scale-95 shadow-sm">
                            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> 使用原始問卷
                        </button>
                    </div>
                    <button onclick="saveDynamicFormConfig()"
                        class="w-full py-3 btn-ind text-white font-black text-xs rounded-xl active:scale-95 shadow-sm">儲存並套用自訂問卷</button>
                </div>

                <!-- 步驟指示器 -->
                <div class="flex items-center gap-2">
                    <div id="step-ind-1" class="step-badge bg-indigo-600 text-white text-xs">1</div>
                    <div class="flex-1 h-0.5 bg-slate-200">
                        <div id="step-line" class="h-full bg-indigo-400 transition-all w-0"></div>
                    </div>
                    <div id="step-ind-2" class="step-badge bg-slate-200 text-slate-400 text-xs">2</div>
                    <div class="flex-1 h-0.5 bg-slate-200"></div>
                    <div id="step-ind-3" class="step-badge bg-slate-200 text-slate-400 text-xs"><i data-lucide="check"
                            class="w-3.5 h-3.5"></i></div>
                </div>
                <p id="step-label" class="text-[10px] font-black text-slate-400 uppercase tracking-wider text-center">步驟
                    1：選擇協助人員</p>

                <!-- 步驟 1：選擇活動與人員 -->
                <div id="wizard-step1" class="space-y-3">
                    <div class="space-y-1.5">
                        <label class="text-[9px] font-black text-slate-400 uppercase block">📅 活動場次名稱</label>
                        <input type="text" id="survey-event-name" placeholder="例如：第三次全團排練"
                            class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 outline-none text-sm font-bold focus:border-indigo-400 transition-all">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[9px] font-black text-slate-400 uppercase block">🗓️ 活動日期</label>
                        <input type="date" id="survey-event-date"
                            class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 outline-none text-sm font-bold focus:border-indigo-400 transition-all">
                    </div>
                    <p id="helper-picker-title" class="text-xs font-bold text-slate-500 text-left">請選擇參與本次活動的協助人員（可多選）：
                    </p>
                    <div id="helper-picker" class="grid grid-cols-2 gap-2.5"></div>
                    <button onclick="goToStep2()" id="btn-step1-next"
                        class="w-full py-4 rounded-2xl text-white font-black text-sm btn-ind active:scale-95 transition-all shadow-md mt-2 flex items-center justify-center gap-2">
                        下一步：填寫交通及用餐統計 <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- 步驟 2：動態產生個人化表格 -->
                <div id="wizard-step2" class="hidden space-y-4">
                    <button onclick="backToStep1()"
                        class="text-[10px] font-black text-slate-400 flex items-center gap-1 hover:text-slate-600 transition-all">
                        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> 返回修改人員選擇
                    </button>
                    <div class="glass p-4 rounded-2xl text-left space-y-1">
                        <p class="text-[9px] font-black text-indigo-500 uppercase">對應活動場次</p>
                        <p id="step2-event-lbl" class="text-xs font-black text-slate-700">-</p>
                    </div>
                    <div id="person-forms" class="space-y-4"></div>
                    <button onclick="handleBatchSubmit()" id="btn-submit-all"
                        class="w-full py-4 rounded-2xl text-white font-black text-sm btn-grn active:scale-95 transition-all shadow-md flex items-center justify-center gap-2">
                        <i data-lucide="upload-cloud" class="w-4 h-4"></i> 確認提交調查
                    </button>
                </div>

                <!-- 步驟 3：完成確認 -->
                <div id="wizard-step3" class="hidden text-center space-y-4 py-8">
                    <div
                        class="w-16 h-16 btn-grn rounded-3xl mx-auto flex items-center justify-center text-white shadow-lg shadow-emerald-200">
                        <i data-lucide="check-circle-2" class="w-8 h-8"></i>
                    </div>
                    <h3 class="text-base font-black text-slate-800">調查提交成功！</h3>
                    <p id="step3-msg" class="text-xs text-slate-500 font-bold"></p>
                    <button onclick="resetWizard()"
                        class="px-6 py-3 rounded-2xl text-white font-black text-sm btn-ind active:scale-95 transition-all shadow-md">重新登記新場次</button>
                </div>
            </div>

            <!-- 調查紀錄分頁 -->
            <div id="tab-records" class="tab-pane hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-base font-black text-slate-800 flex items-center gap-1.5"><i
                            data-lucide="clipboard-list" class="w-4 h-4 text-indigo-500"></i> 調查申報紀錄</h2>
                    <button onclick="loadPastReports()"
                        class="w-8 h-8 bg-white border border-slate-200 rounded-xl flex items-center justify-center text-slate-500 active:scale-95"><i
                            data-lucide="refresh-cw" class="w-3.5 h-3.5"></i></button>
                </div>
                <div id="past-reports" class="space-y-3"></div>
            </div>

            <!-- 個人設定分頁 -->
            <div id="tab-profile" class="tab-pane hidden space-y-4 text-left">
                <h2 class="text-base font-black text-slate-800 flex items-center gap-1.5"><i data-lucide="user"
                        class="w-4 h-4 text-indigo-500"></i> 個人設定</h2>

                <div class="glass p-5 rounded-3xl shadow-sm space-y-4">
                    <div class="space-y-1">
                        <label class="text-[9px] font-black text-slate-400 uppercase">基本資料 (唯讀)</label>
                        <div class="bg-slate-50 border border-slate-100 rounded-2xl p-3.5 space-y-1">
                            <p class="text-xs font-black text-slate-700" id="prof-name-email">-</p>
                            <p class="text-[10px] font-semibold text-slate-400" id="prof-section-inst">-</p>
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-[9px] font-black text-slate-400 uppercase block">📞 聯絡電話</label>
                        <input type="tel" id="prof-phone" placeholder="輸入電話號碼"
                            class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 outline-none text-xs font-semibold focus:border-indigo-400 transition-all">
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-[9px] font-black text-slate-400 uppercase block">🎂 出生年月日 (年-月-日)</label>
                        <input type="text" id="prof-birthday" placeholder="例如: 1995-10-24"
                            class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 outline-none text-xs font-semibold focus:border-indigo-400 transition-all">
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-[9px] font-black text-slate-400 uppercase block">🪪 身分證字號(辦理保險所需)</label>
                        <input type="text" id="prof-id-number" placeholder="例如: A123456789"
                            class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 outline-none text-xs font-semibold focus:border-indigo-400 transition-all uppercase">
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-[9px] font-black text-slate-400 uppercase block">🔑 修改密碼 (留空表示不修改)</label>
                        <input type="password" id="prof-password" placeholder="輸入新密碼"
                            class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 outline-none text-xs font-semibold focus:border-indigo-400 transition-all">
                    </div>

                    <!-- 個資同意條款 -->
                    <div class="space-y-1.5 pt-2 border-t border-slate-100">
                        <label class="text-[9px] font-black text-indigo-500 uppercase block">📋 個人資料保護申報條款</label>
                        <div
                            class="bg-indigo-50/50 border border-indigo-100 rounded-2xl p-3.5 space-y-2 text-[10px] text-slate-600 font-bold leading-relaxed">
                            <p>本人同意提供以上個人資料（聯絡電話、生日、身分證字號）僅供樂團辦理活動保險、乘車安排與防事故聯絡。樂團基於個人資料保護法應盡保密之責，不得挪做他用。</p>
                            <div class="flex items-center gap-2 pt-1">
                                <span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded text-[8px] font-black"
                                    id="prof-consent-status">尚未同意</span>
                            </div>
                        </div>
                        <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-600 mt-2">
                            <input type="checkbox" id="prof-consent-chk" class="accent-indigo-600 w-4 h-4 rounded">
                            我同意上述條款並授權使用
                        </label>
                    </div>

                    <button onclick="saveMyProfile()" id="btn-save-profile"
                        class="w-full py-4 rounded-2xl text-white font-black text-sm btn-grn active:scale-95 transition-all shadow-md flex items-center justify-center gap-2">
                        <i data-lucide="check-circle-2" class="w-4 h-4"></i> 儲存個人設定
                    </button>
                </div>
            </div>

        </div><!-- /v-dash -->
    </div>

    <!-- 底部導覽列 -->
    <div id="bottom-nav"
        class="hidden fixed bottom-0 left-0 right-0 z-40 bg-white/90 backdrop-blur-md border-t border-slate-200 shadow-lg">
        <div class="max-w-md mx-auto flex">
            <button onclick="switchTab('roster')" id="nav-roster"
                class="nav-item flex-1 flex flex-col items-center py-2.5 text-slate-400 transition-all">
                <i data-lucide="users" class="w-5 h-5 mb-0.5"></i>
                <span class="text-[8px] font-black tracking-wider uppercase">組員管理</span>
            </button>
            <button onclick="switchTab('reports')" id="nav-reports"
                class="nav-item flex-1 flex flex-col items-center py-2.5 text-slate-400 transition-all">
                <i data-lucide="car" class="w-5 h-5 mb-0.5"></i>
                <span class="text-[8px] font-black tracking-wider uppercase">交通用餐</span>
            </button>
            <button onclick="switchTab('records')" id="nav-records"
                class="nav-item flex-1 flex flex-col items-center py-2.5 text-slate-400 transition-all">
                <i data-lucide="clipboard-list" class="w-5 h-5 mb-0.5"></i>
                <span class="text-[8px] font-black tracking-wider uppercase">調查紀錄</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile"
                class="nav-item flex-1 flex flex-col items-center py-2.5 text-slate-400 transition-all">
                <i data-lucide="user" class="w-5 h-5 mb-0.5"></i>
                <span class="text-[8px] font-black tracking-wider uppercase">個人設定</span>
            </button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxXYCpCifba8ltSrkSMJx9qF2_wNbSZN8Gm7VnOxFdc_p6PWPf8_0H4uQZ_37h2bupr/exec";
        let curUser = null, staffRoster = [], selectedHelpers = [], selectedSurveyEvent = null;

        let customQuestions = [
            { id: 'q_transit', title: '🚘 交通方式', type: 'checkbox', options: ['自行開車', '去程搭車', '回程搭車'], required: true },
            { id: 'q_parking', title: '🅿️ 停車需求', type: 'text', options: [''], required: false },
            { id: 'q_meal', title: '🍱 膳食調查', type: 'checkbox', options: ['用餐', '不用餐/自備'], required: true },
            { id: 'q_snack', title: '🍡 點心需求', type: 'radio', options: ['需要點心', '不用點心'], required: true }
        ];

        function maskID(id) {
            if (!id) return '';
            id = id.trim().toUpperCase();
            if (id.length >= 7) {
                return id.substring(0, 4) + 'xxx' + id.substring(7);
            }
            return id;
        }

        function maskBirthday(bday) {
            if (!bday) return '';
            const str = String(bday).trim();
            if (str.includes('-')) {
                const pts = str.split('-');
                return 'xx-' + pts.slice(1).join('-');
            }
            if (str.includes('/')) {
                const pts = str.split('/');
                return 'xx/' + pts.slice(1).join('/');
            }
            return bday;
        }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const stored = localStorage.getItem('asst_user');
            const savedCustomQ = localStorage.getItem('custom_dynamic_questions');
            if (savedCustomQ) { try { customQuestions = JSON.parse(savedCustomQ); } catch (e) { } }
            if (stored) { try { curUser = JSON.parse(stored); showDash(); } catch (e) { showLogin(); } }
            else showLogin();
        });

        let toastTid = null;
        function showToast(msg, isErr = false) {
            const t = document.getElementById('toast'), ico = document.getElementById('toast-icon'), txt = document.getElementById('toast-msg');
            txt.innerText = msg;
            t.className = t.className.replace(/bg-\w+-\d+/g, '') + (isErr ? ' bg-rose-500' : ' bg-emerald-500');
            ico.setAttribute('data-lucide', isErr ? 'alert-circle' : 'check-circle-2');
            lucide.createIcons();
            t.style.opacity = '1'; t.style.transform = 'translate(-50%,0)'; t.style.pointerEvents = 'auto';
            if (toastTid) clearTimeout(toastTid);
            toastTid = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translate(-50%,-16px)'; t.style.pointerEvents = 'none'; }, 3000);
        }

        function setBtnLoading(btn, on, txt = '處理中...') {
            if (!btn) return;
            if (on) { btn.disabled = true; btn.dataset.orig = btn.innerHTML; btn.innerHTML = `<span class="flex items-center gap-2"><svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"/><path fill="currentColor" class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>${txt}</span>`; }
            else { btn.disabled = false; btn.innerHTML = btn.dataset.orig || btn.innerHTML; }
        }

        async function api(action, data) {
            try {
                const r = await fetch(GAS_URL, { method: 'POST', mode: 'cors', cache: 'no-cache', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, data }) });
                return await r.json();
            } catch (e) { return { success: false, message: e.toString() }; }
        }

        function setAuthMode(mode) {
            const isLogin = mode === 'login';
            document.getElementById('form-login').classList.toggle('hidden', !isLogin);
            document.getElementById('form-register').classList.toggle('hidden', isLogin);
            document.getElementById('tab-login').className = `flex-1 py-2 rounded-xl text-xs font-black transition-all ${isLogin ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400'}`;
            document.getElementById('tab-register').className = `flex-1 py-2 rounded-xl text-xs font-black transition-all ${!isLogin ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400'}`;
        }

        async function handleLogin() {
            const email = document.getElementById('l-email').value.trim();
            const pass = document.getElementById('l-pass').value.trim();
            if (!email || !pass) return showToast('請輸入信箱與密碼', true);
            const btn = document.getElementById('btn-login'); setBtnLoading(btn, true, '驗證中...');
            const res = await api('loginUser', { email, password: pass });
            setBtnLoading(btn, false);
            if (res.success && res.userData) {
                const u = res.userData;
                if (['Admin', 'Officer'].includes(u.Role) || u.Section === '行政組') {
                    curUser = u; localStorage.setItem('asst_user', JSON.stringify(u)); showDash();
                } else {
                    showToast('您的帳號無權限訪問此頁面', true);
                }
            } else { showToast(res.message || '登入失敗', true); }
        }

        async function handleRegister() {
            const name = document.getElementById('r-name').value.trim();
            const email = document.getElementById('r-email').value.trim();
            const pass = document.getElementById('r-pass').value.trim();
            const instrument = document.getElementById('r-instrument').value;
            if (!name || !email || !pass) return showToast('請填寫所有欄位', true);
            const btn = document.getElementById('btn-register'); setBtnLoading(btn, true, '申請中...');
            const res = await api('registerUser', { name, email, password: pass, section: '行政組', instrument });
            setBtnLoading(btn, false);
            if (res.success) { showToast('帳號申請成功！請使用新帳密登入'); setAuthMode('login'); document.getElementById('l-email').value = email; }
            else showToast(res.message || '申請失敗', true);
        }

        function handleLogout() { localStorage.removeItem('asst_user'); curUser = null; showLogin(); showToast('已登出'); }

        function addBuilderQuestion() {
            customQuestions.push({
                id: 'q_' + Date.now(),

                type: 'checkbox',
                options: ['選項A', '選項B'],

        function removeBuilderQuestion(idx) {

        function saveDynamicFormConfig() {
            const container = document.getElementById('builder-questions-list');
            const cards = container.querySelectorAll('[data-qid]');
            const newQ = [];
            cards.forEach((card, idx) => {
                const title = card.querySelector('.q-title-input').value.trim() || `題目 ${idx + 1}`;
                const type = card.querySelector('.q-type-select').value;
                const optVal = card.querySelector('.q-options-input')?.value || '';
                const options = optVal.split(',').map(s => s.trim()).filter(Boolean);
                const required = !!card.querySelector('.q-required-check')?.checked;
                newQ.push({
                    id: card.dataset.qid,
                    title,
                    type,
                    options,
                    required
                });
            });
            customQuestions = newQ;
            localStorage.setItem('custom_dynamic_questions', JSON.stringify(customQuestions));
            closeFormBuilder();
            showToast('自訂問卷題目與選項已成功儲存！');

        function resetToDefaultQuestions() {
            customQuestions = [
                { id: 'q_transit', title: '🚘 交通方式', type: 'checkbox', options: ['自行開車', '去程搭車', '回程搭車'], required: true },

        async function switchTab(tabId) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(el => { el.classList.remove('text-indigo-600'); });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).classList.add('text-indigo-600');
            lucide.createIcons();
            if (tabId === 'roster') loadRoster();
            if (tabId === 'reports') {
                if (staffRoster.length === 0) { await loadStaffRoster(); }
                buildHelperPicker(); loadSurveyEvents();
            }
            if (tabId === 'records') loadPastReports();
            if (tabId === 'profile') loadMyProfile();

        async function loadMyProfile() {
            if (!curUser) return;
            if (staffRoster.length === 0) { await loadStaffRoster(); }
            const myInfo = staffRoster.find(m => m.Email.toLowerCase() === curUser.Email.toLowerCase()) || curUser;

            document.getElementById('prof-name-email').innerText = `${myInfo.Name || curUser.Name} (${myInfo.Email || curUser.Email})`;
            document.getElementById('prof-section-inst').innerText = `${myInfo.Section || curUser.Section || '行政組'} / ${myInfo.Instrument || curUser.Instrument || '協助人員'}`;
            document.getElementById('prof-phone').value = myInfo.Phone || '';

            let birthday = '';
            if (myInfo.Birthday) {
                birthday = myInfo.Birthday instanceof Date
                    ? myInfo.Birthday.toISOString().substring(0, 10)
                    : String(myInfo.Birthday).substring(0, 10);
            }
            document.getElementById('prof-birthday').value = maskBirthday(birthday);
            document.getElementById('prof-id-number').value = maskID(myInfo.ID_Number || '');
            document.getElementById('prof-password').value = '';

            const consentStatusEl = document.getElementById('prof-consent-status');
            const consentChk = document.getElementById('prof-consent-chk');

            const hasConsented = myInfo.PrivacyConsent && String(myInfo.PrivacyConsent).toUpperCase().startsWith('YES');
            if (hasConsented) {
                consentStatusEl.innerText = `已同意 (${String(myInfo.PrivacyConsent)})`;
                consentStatusEl.className = "bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-[8px] font-black";
                consentChk.checked = true;
            } else {
                consentStatusEl.innerText = "尚未同意";
                consentStatusEl.className = "bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-[8px] font-black";
                consentChk.checked = false;
            }
            lucide.createIcons();
        }

        async function saveMyProfile() {
            if (!curUser) return;
            const btn = document.getElementById('btn-save-profile');
            const phone = document.getElementById('prof-phone').value.trim();
            let birthday = document.getElementById('prof-birthday').value.trim();
            let idNumber = document.getElementById('prof-id-number').value.trim().toUpperCase();
            const password = document.getElementById('prof-password').value.trim();
            const consentChk = document.getElementById('prof-consent-chk').checked;
            const privacyConsent = consentChk ? 'YES' : 'NO';

            const myInfo = staffRoster.find(m => m.Email.toLowerCase() === curUser.Email.toLowerCase()) || curUser;
            const origBirthday = myInfo.Birthday ? (myInfo.Birthday instanceof Date ? myInfo.Birthday.toISOString().substring(0, 10) : String(myInfo.Birthday).substring(0, 10)) : '';
            const origIDNumber = myInfo.ID_Number || '';

            if (birthday.includes('xx-') || birthday.includes('xx/')) {
                const origYear = origBirthday ? origBirthday.substring(0, 4) : new Date().getFullYear();
                birthday = birthday.replace('xx', origYear);
            }
            if (idNumber.includes('XXX')) {
                const origMiddle = origIDNumber && origIDNumber.length >= 7 ? origIDNumber.substring(4, 7) : '123';
                idNumber = idNumber.replace('XXX', origMiddle);
            }

            setBtnLoading(btn, true, '正在儲存...');
            const res = await api('saveMember', { email: curUser.Email, phone, birthday, idNumber, password, privacyConsent });
            setBtnLoading(btn, false);

            if (res.success) {
                showToast('個人設定與同意書已儲存成功！');
                curUser.Phone = phone;
                curUser.Birthday = birthday;
                curUser.ID_Number = idNumber;
                if (privacyConsent === 'YES') {
                    const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 16);
                    curUser.PrivacyConsent = `YES (${nowStr})`;
                } else {
                    curUser.PrivacyConsent = 'NO';
                }
                localStorage.setItem('asst_user', JSON.stringify(curUser));
                await loadStaffRoster();
                loadMyProfile();
            } else {
                showToast(res.message || '儲存失敗', true);
            }
        }

        async function loadStaffRoster() {
            const res = await api('getStaffList', {});
            if (res.success && Array.isArray(res.data)) { staffRoster = res.data; }
        }

        async function loadRoster() {
            const listEl = document.getElementById('roster-list');
            listEl.innerHTML = '<div class="py-8 text-center text-xs font-bold text-slate-400">同步中...</div>';

                const safeName = String(m.Name || '成員');
                const safeEmail = String(m.Email || '');
                const safePhone = String(m.Phone || '未填');
                const instrument = String(m.Instrument || '行政');
                return `<div class="glass border border-slate-100 p-4 rounded-2xl flex justify-between items-center shadow-sm text-left">

        <p class="text-xs font-black text-slate-800">${safeName} <span class="text-[9px] text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full ml-1">${instrument}</span></p>

                if (isLeader && curUser.Instrument) {
                    targetList = staffRoster.filter(m => m.Instrument === curUser.Instrument);
                    titleEl.innerText = `請選擇 ${curUser.Instrument} 參與本次活動的組員（可多選）：`;
                } else {
                    targetList = staffRoster.filter(m => m.Email.toLowerCase() === curUser.Email.toLowerCase());

                        targetList = [{ Name: curUser.Name, Email: curUser.Email, Instrument: curUser.Instrument || '行政' }];

                    titleEl.innerText = `確認您的交通與用餐登記：`;

                const safeName = String(m.Name || '助');

        function toggleHelper(card, email) {
            const idx = selectedHelpers.indexOf(email);
            const chkBox = document.getElementById('chk-' + email.replace(/[@.]/g, '_'));
            if (idx > -1) {
                selectedHelpers.splice(idx, 1);
                card.classList.remove('selected');
                chkBox.innerHTML = ''; chkBox.classList.remove('bg-indigo-600', 'border-indigo-600'); chkBox.classList.add('border-slate-300');
            } else {
                selectedHelpers.push(email);
                card.classList.add('selected');
                chkBox.innerHTML = '<svg class="w-2.5 h-2.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>';
                chkBox.classList.add('bg-indigo-600', 'border-indigo-600'); chkBox.classList.remove('border-slate-300');
            }
        }

        function goToStep2() {
            if (selectedHelpers.length === 0) return showToast('請至少選取一位協助人員', true);
            const evName = document.getElementById('survey-event-name').value.trim();
            const evDate = document.getElementById('survey-event-date').value.trim();

            if (!evDate) return showToast('請選擇活動日期', true);
            selectedSurveyEvent = { name: evName, date: evDate };
            document.getElementById('step2-event-lbl').innerText = `${evName}（${evDate}）`;
            const sel = staffRoster.length > 0 ? staffRoster.filter(m => selectedHelpers.includes(m.Email)) : selectedHelpers.map(e => ({ Email: e, Name: curUser.Name, Instrument: curUser.Instrument }));
            const container = document.getElementById('person-forms');
            container.innerHTML = sel.map(m => buildPersonForm(m)).join('');

            document.getElementById('wizard-step2').classList.remove('hidden');

            lucide.createIcons();

        function buildPersonForm(m) {

            const borderCls = roleColors[m.Instrument] || 'border-slate-200';
            const safeName = String(m.Name || '助');
            const initial = safeName.charAt(0) || '助';
            const phone = m.Phone || '';
            const birthdayRaw = m.Birthday ? (m.Birthday instanceof Date ? m.Birthday.toISOString().substring(0, 10) : String(m.Birthday).substring(0, 10)) : '';
            const idNumberRaw = m.ID_Number || '';
            const birthdayShow = maskBirthday(birthdayRaw);
            const idNumberShow = maskID(idNumberRaw);
            const emailKey = m.Email.replace(/[@.]/g, '_');

            const dynamicQuestionsHTML = customQuestions.map(q => {
                let inputsHTML = '';
                if (q.type === 'checkbox') {
                    inputsHTML = `<div class="flex flex-wrap gap-4 pt-0.5">` + (q.options || []).map(opt => `
                        <label class="flex items-center gap-1.5 cursor-pointer text-xs font-bold text-slate-600">
                            <input type="checkbox" name="dyn_${q.id}_${emailKey}" value="${opt}" class="accent-indigo-600 w-4 h-4 rounded"> ${opt}
                        </label>
                    `).join('') + `</div>`;
                } else if (q.type === 'radio') {
                    inputsHTML = `<div class="grid grid-cols-2 gap-2">` + (q.options || []).map((opt, i) => `
                        <label class="flex-1 text-center py-2.5 rounded-xl bg-slate-50 border border-slate-200 cursor-pointer text-[10px] font-black text-slate-600 hover:bg-amber-50 hover:border-amber-300 transition-all has-[:checked]:bg-amber-600 has-[:checked]:text-white has-[:checked]:border-amber-600">
                            <input type="radio" name="dyn_${q.id}_${emailKey}" value="${opt}" ${i === 0 ? 'checked' : ''} class="sr-only">
                            ${opt}
                        </label>
                    `).join('') + `</div>`;
                } else if (q.type === 'text') {
                    inputsHTML = `<input type="text" name="dyn_${q.id}_${emailKey}" placeholder="請填寫..." class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 outline-none text-xs font-semibold focus:border-indigo-400 transition-all">`;
                }

                return `
                <div class="space-y-1.5 text-left" data-qid="${q.id}">
                    <label class="text-[9px] font-black text-slate-400 uppercase">${q.title} ${q.required ? '<span class="text-rose-500 font-extrabold">*</span>' : ''}</label>
                    ${inputsHTML}
                </div>`;
            }).join('');

            return `<div class="glass p-4 rounded-3xl shadow-sm border-l-4 ${borderCls} space-y-3.5" data-email="${m.Email}" data-name="${safeName}" data-instrument="${m.Instrument || '行政'}">
    <div class="flex items-center gap-2 pb-2 border-b border-slate-100">
      <div class="w-8 h-8 btn-ind rounded-xl text-white font-black text-sm flex items-center justify-center shrink-0">${initial}</div>
      <div><p class="text-xs font-black text-slate-800">${safeName}</p><p class="text-[9px] font-bold text-slate-400">${m.Instrument || '行政'} ・ ${m.Email}</p></div>
    </div>
    
    ${dynamicQuestionsHTML}

    <div class="grid grid-cols-2 gap-2 text-left">
      <div class="space-y-1">
        <label class="text-[9px] font-black text-slate-400 uppercase">聯絡電話</label>
        <input type="tel" name="phone" value="${phone}" placeholder="未建檔，請輸入" class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 outline-none text-xs font-semibold focus:border-indigo-400 transition-all">
      </div>
      <div class="space-y-1">
        <label class="text-[9px] font-black text-slate-400 uppercase">生日 (年-月-日)</label>
        <input type="text" name="birthday" value="${birthdayShow}" placeholder="1995-10-24" class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 outline-none text-xs font-semibold focus:border-indigo-400 transition-all">
      </div>
    </div>
    <div class="space-y-1 text-left">
      <label class="text-[9px] font-black text-slate-400 uppercase block">身分證字號 (辦理保險與安全名冊)</label>
      <input type="text" name="idNumber" value="${idNumberShow}" placeholder="例如: A123456789" class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 outline-none text-xs font-semibold focus:border-indigo-400 transition-all uppercase">
    </div>

    <div class="space-y-1.5 text-left">
      <label class="text-[9px] font-black text-slate-400 uppercase">備註特殊說明</label>
      <textarea name="notes" rows="1" placeholder="如飲料去冰、海鮮過敏等" class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 outline-none text-xs font-semibold focus:border-indigo-400 resize-none"></textarea>
    </div>
  </div>`;
        }

        async function handleBatchSubmit() {
            if (!selectedSurveyEvent?.name) return showToast('請先返回步驟一並選擇活動場次', true);
            const forms = document.querySelectorAll('#person-forms > div[data-email]');
            const replies = [];
            for (const f of forms) {
                const email = f.dataset.email, name = f.dataset.name;
                const emailKey = email.replace(/[@.]/g, '_');

                let transitSummary = [];
                let parkingSummary = [];
                let mealSummary = [];
                let otherAnswers = [];

                let validationMsg = '';
                customQuestions.forEach(q => {
                    const inputs = f.querySelectorAll(`[name="dyn_${q.id}_${emailKey}"]`);
                    if (q.type === 'checkbox') {
                        const checked = Array.from(inputs).filter(i => i.checked).map(i => i.value);
                        const val = checked.join('、') || '未填';
                        if (q.required && checked.length === 0) {
                            validationMsg = `請填寫【${name}】的「${q.title.replace(/[^\w\u4e00-\u9fa5\s]/g, '').trim()}」`;
                        }
                        if (q.title.includes('交通')) transitSummary.push(val);
                        else if (q.title.includes('停車')) parkingSummary.push(val);
                        else if (q.title.includes('膳食') || q.title.includes('用餐')) mealSummary.push(val);
                        else otherAnswers.push(`${q.title}: ${val}`);
                    } else if (q.type === 'radio') {
                        const checked = Array.from(inputs).find(i => i.checked);
                        const val = checked ? checked.value : '未填';
                        if (q.required && !checked) {
                            validationMsg = `請選擇【${name}】的「${q.title.replace(/[^\w\u4e00-\u9fa5\s]/g, '').trim()}」`;
                        }
                        if (q.title.includes('膳食') || q.title.includes('用餐')) mealSummary.push(val);
                        else if (q.title.includes('點心')) mealSummary.push(`點心:${val}`);
                        else otherAnswers.push(`${q.title}: ${val}`);
                    } else if (q.type === 'text') {
                        const val = inputs[0] ? inputs[0].value.trim() : '';
                        if (q.required && !val) {
                            validationMsg = `請填寫【${name}】的「${q.title.replace(/[^\w\u4e00-\u9fa5\s]/g, '').trim()}」`;
                        }
                        if (val) otherAnswers.push(`${q.title}: ${val}`);
                    }
                });

                if (validationMsg) {
                    return showToast(validationMsg, true);
                }

                const phoneEl = f.querySelector('input[name="phone"]');
                const birthdayEl = f.querySelector('input[name="birthday"]');
                const idNumberEl = f.querySelector('input[name="idNumber"]');
                const notesEl = f.querySelector('textarea[name="notes"]');

                const member = staffRoster.find(m => m.Email.toLowerCase() === email.toLowerCase()) || {};
                const origBirthday = member.Birthday ? (member.Birthday instanceof Date ? member.Birthday.toISOString().substring(0, 10) : String(member.Birthday).substring(0, 10)) : '';
                const origIDNumber = member.ID_Number || '';

                let birthdayValue = birthdayEl ? birthdayEl.value.trim() : '';
                let idNumberValue = idNumberEl ? idNumberEl.value.trim().toUpperCase() : '';

                if (birthdayValue.includes('xx-') || birthdayValue.includes('xx/')) {
                    const origYear = origBirthday ? origBirthday.substring(0, 4) : new Date().getFullYear();
                    birthdayValue = birthdayValue.replace('xx', origYear);
                }
                if (idNumberValue.includes('XXX')) {
                    const origMiddle = origIDNumber && origIDNumber.length >= 7 ? origIDNumber.substring(4, 7) : '123';
                    idNumberValue = idNumberValue.replace('XXX', origMiddle);
                }

                // 同步回本地名冊快取中，以便保持一致
                const rosterMember = staffRoster.find(m => m.Email.toLowerCase() === email.toLowerCase());
                if (rosterMember) {
                    rosterMember.Phone = phoneEl ? phoneEl.value.trim() : rosterMember.Phone;
                    rosterMember.Birthday = birthdayValue;
                    rosterMember.ID_Number = idNumberValue;
                }

                replies.push({
                    email,
                    name,
                    transit: transitSummary.join(' / ') || '無',
                    parking: parkingSummary.join(' / ') || '無',
                    meal: mealSummary.join(' / ') + (otherAnswers.length ? ' | ' + otherAnswers.join(', ') : ''),
                    phone: phoneEl ? phoneEl.value.trim() : '',
                    birthday: birthdayValue,
                    idNumber: idNumberValue,
                    notes: notesEl ? notesEl.value.trim() : ''
                });
            }

            const btn = document.getElementById('btn-submit-all');
            setBtnLoading(btn, true, `提交 ${replies.length} 人調查中...`);

            const res = await api('submitStaffReport', {
                date: selectedSurveyEvent.date,
                eventName: selectedSurveyEvent.name,
                email: curUser.Email,
                name: curUser.Name,
                replies
            });
            setBtnLoading(btn, false);

            if (res.success) {
                document.getElementById('wizard-step2').classList.add('hidden');
                document.getElementById('wizard-step3').classList.remove('hidden');
                document.getElementById('step3-msg').innerText = `成功提交 ${replies.length} 位協助人員的交通與用餐需求統計！（${selectedSurveyEvent.name} ${selectedSurveyEvent.date}）`;
                setStepVisual(3);
            } else {
                showToast(res.message || '提交失敗', true);
            }
        }

        function resetWizard() {
            selectedHelpers = [];
            selectedSurveyEvent = null;
            document.getElementById('wizard-step1').classList.remove('hidden');
            document.getElementById('wizard-step2').classList.add('hidden');
            document.getElementById('wizard-step3').classList.add('hidden');
            buildHelperPicker(); setStepVisual(1);
        }

        function backToStep1() {
            document.getElementById('wizard-step2').classList.add('hidden');
            document.getElementById('wizard-step1').classList.remove('hidden');
            setStepVisual(1);
        }

        function setStepVisual(step) {
            const badges = ['step-ind-1', 'step-ind-2', 'step-ind-3'];
            const labels = ['步驟 1：選擇協助人員', '步驟 2：填寫個人交通與用餐需求', '完成提交！'];
            badges.forEach((id, i) => {
                const el = document.getElementById(id);
                if (i + 1 < step) { el.className = 'step-badge bg-emerald-500 text-white'; el.innerHTML = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>'; }
                else if (i + 1 === step) { el.className = 'step-badge bg-indigo-600 text-white'; el.innerText = String(i + 1); }
                else { el.className = 'step-badge bg-slate-200 text-slate-400'; el.innerText = String(i + 1); }
            });
            document.getElementById('step-line').style.width = step >= 2 ? '100%' : '0';
            document.getElementById('step-label').innerText = labels[step - 1] || '';
        }

        async function loadPastReports() {
            const listEl = document.getElementById('past-reports');
            listEl.innerHTML = '<div class="py-8 text-center text-xs text-slate-400 font-bold">載入中...</div>';
            const roleType = curUser.Instrument || 'all';
            const res = await api('getStaffReports', { roleType: ['Admin', 'Officer'].includes(curUser.Role) ? 'all' : roleType });
            if (res.success && res.data?.length > 0) {
                listEl.innerHTML = res.data.slice(0, 30).map(l => {
                    const transitBadge = l.transit.includes('自行開車') ? 'bg-blue-50 text-blue-600' : 'bg-slate-100 text-slate-500';
                    const mealBadge = l.meal.includes('素') ? 'bg-amber-50 text-amber-600' : 'bg-emerald-50 text-emerald-600';
                    return `<div class="glass border border-slate-100 p-4 rounded-2xl shadow-sm text-left space-y-1.5">
        <div class="flex justify-between items-start">
          <div><p class="text-xs font-black text-slate-800">${l.eventName}</p><p class="text-[8px] font-bold text-slate-400">${l.date} · 登記人: ${l.fillerName}</p></div>
          <span class="text-[8px] font-black px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-600 shrink-0">${l.roleType}</span>
        </div>
        <div class="flex flex-col gap-1 pt-1">
          <span class="text-xs font-black text-slate-800">${l.name}</span>
          <div class="flex flex-wrap gap-1">
            <span class="text-[9px] font-black px-2 py-0.5 rounded-full ${transitBadge}">🚗 交通: ${l.transit}</span>
            <span class="text-[9px] font-black px-2 py-0.5 rounded-full ${mealBadge}">🍱 餐點: ${l.meal}</span>
          </div>
        </div>
        <div class="text-[9px] font-bold text-slate-500 space-y-0.5 border-t border-dashed border-slate-100 pt-1.5 mt-1.5">
          <p>● 停車/其他: ${l.parking || '無'}</p>
          ${l.notes ? `<p>● 備註: <span class="text-rose-500">${l.notes}</span></p>` : ''}
        </div>
      </div>`;
                }).join('');
                lucide.createIcons();
            } else if (res.success) {
                listEl.innerHTML = '<div class="py-12 text-center text-xs text-slate-400 font-bold bg-white/40 rounded-3xl">尚無調查申報紀錄</div>';
            } else {
                listEl.innerHTML = `<div class="py-8 text-center text-xs text-rose-500 font-bold">載入失敗</div>`;
            }
        }
    </script>
</body>

</html>
